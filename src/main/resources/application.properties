spring.application.name=asgi-watch
server.port=8080

# PostgreSQL Configuration for local agsi database
spring.datasource.url=jdbc:postgresql://localhost:5432/agsi
spring.datasource.username=simon
spring.datasource.password=N0m1596.
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Static resources
spring.web.resources.static-locations=classpath:/static/

# Spring AI MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=asgi-watch-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=AGSI Watch MCP Server provides tools to inspect European underground gas storage inventories, regional overviews, country statistics, facility time-series developments, and historical storage metrics.
spring.ai.mcp.server.protocol=SSE
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.server.annotation-scanner.enabled=true

